<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244" role="img" aria-label="The platform so far: the foundation on 14 October, both conditions on 15 October, the walk through the yards on 4 November, real studies on 7 November, one tradition per participant on 8 November, deployed on Supabase PostgreSQL 17 in Mumbai on 9 November">
<title>The platform so far: the foundation on 14 October, both conditions on 15 October, the walk through the yards on 4 November, real studies on 7 November, one tradition per participant on 8 November, deployed on Supabase PostgreSQL 17 in Mumbai on 9 November</title>
<defs>
<style>.d{font-family:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.s{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.prog{stroke-dasharray:980;stroke-dashoffset:0;animation:prog 2.4s cubic-bezier(.4,0,.2,1) .2s both}@keyframes prog{from{stroke-dashoffset:980}to{stroke-dashoffset:0}}.halo{animation:halo 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}.ahead{stroke-dasharray:2 10}.r0{animation-delay:0.1s}.r1{animation-delay:0.3s}.r2{animation-delay:0.4s}.r3{animation-delay:0.6s}.r4{animation-delay:0.7s}.r5{animation-delay:0.9s}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.sweep{fill:url(#still)}}</style>
<linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="1090" y2="0"><stop offset="0" stop-color="#C090F5"/><stop offset="1" stop-color="#AA69E9"/></linearGradient>
</defs>
<path class="ahead" d="M70 112 H1130" stroke="#3A3350" stroke-width="3" stroke-linecap="round" fill="none"/>
<path class="prog" d="M110 112 H1090" stroke="url(#pg)" stroke-width="4" stroke-linecap="round" fill="none"/>
<g class="rise r0">
<text x="110" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">14 OCT</text>

<circle cx="110" cy="112" r="8" fill="#1A1725" stroke="#C090F5" stroke-width="3"/>
<text x="110" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Foundation</text>
<text x="110" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Schema, roles, six</text><text x="110" y="198" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">traditions</text>
</g>
<g class="rise r1">
<text x="306" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">15 OCT</text>

<circle cx="306" cy="112" r="8" fill="#1A1725" stroke="#C090F5" stroke-width="3"/>
<text x="306" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Both conditions</text>
<text x="306" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">2D pages and a 3D museum</text>
</g>
<g class="rise r2">
<text x="502" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">4 NOV</text>

<circle cx="502" cy="112" r="8" fill="#1A1725" stroke="#C090F5" stroke-width="3"/>
<text x="502" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Walking the process</text>
<text x="502" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Door 2 yards, one template</text>
</g>
<g class="rise r3">
<text x="698" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">7 NOV</text>

<circle cx="698" cy="112" r="8" fill="#1A1725" stroke="#C090F5" stroke-width="3"/>
<text x="698" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Real studies</text>
<text x="698" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Consent, battery, outcomes</text>
</g>
<g class="rise r4">
<text x="894" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">8 NOV</text>

<circle cx="894" cy="112" r="8" fill="#1A1725" stroke="#C090F5" stroke-width="3"/>
<text x="894" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">One tradition each</text>
<text x="894" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Balanced by door, roles by</text><text x="894" y="198" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">task</text>
</g>
<g class="rise r5">
<text x="1090" y="82" class="m" fill="#D6B6FB" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">9 NOV</text>
<circle class="halo" cx="1090" cy="112" r="10" fill="#C090F5"/>
<circle cx="1090" cy="112" r="10" fill="#C090F5" stroke="#C090F5" stroke-width="3"/>
<text x="1090" y="156" class="d" fill="#F2F0F9" font-size="16" font-weight="700" text-anchor="middle">Deployed</text>
<text x="1090" y="179" class="s" fill="#9E98B2" font-size="13" text-anchor="middle">Supabase PG17, Vercel bom1</text>
</g>
</svg>
